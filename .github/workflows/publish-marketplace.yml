name: Publish Extension to Marketplace

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar en Marketplace (false = solo validaciones)"
        required: true
        default: false
        type: boolean
      expected_version:
        description: "Version esperada (opcional, ejemplo: 1.2.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preflight checks (safe CI environment)
        run: npm run release:preflight

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: access-explorer-vsix
          path: .artifacts/access-explorer.vsix

      - name: Detect version change
        id: version
        run: |
          node <<'EOF'
          const fs = require('fs');
          const cp = require('child_process');

          const before = process.env.GITHUB_EVENT_BEFORE || '';
          const nowVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;

          let oldVersion = '';
          try {
            if (before) {
              const oldPkg = cp.execSync(`git show ${before}:package.json`, { encoding: 'utf8' });
              oldVersion = JSON.parse(oldPkg).version || '';
            }
          } catch {
            oldVersion = '';
          }

          const changed = oldVersion !== nowVersion;
          const out = process.env.GITHUB_OUTPUT;

          fs.appendFileSync(out, `old_version=${oldVersion}\n`);
          fs.appendFileSync(out, `new_version=${nowVersion}\n`);
          fs.appendFileSync(out, `version_changed=${String(changed)}\n`);

          console.log(`Old version: ${oldVersion || '(none)'}`);
          console.log(`New version: ${nowVersion}`);
          console.log(`Version changed: ${changed}`);
          EOF
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}

      - name: Validate expected version (manual runs)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.expected_version != ''
        run: |
          EXPECTED="${{ github.event.inputs.expected_version }}"
          ACTUAL="${{ steps.version.outputs.new_version }}"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::La version esperada ($EXPECTED) no coincide con package.json ($ACTUAL)."
            exit 1
          fi

      - name: Guard workflow file changes
        id: guard
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BEFORE" "${{ github.sha }}")"
          echo "Archivos cambiados en el push:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^\.github/workflows/'; then
            echo "safe=false" >> "$GITHUB_OUTPUT"
            echo "Se detectaron cambios en workflows. Se bloquea publicación automática para proteger secretos."
          else
            echo "safe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide publish mode
        id: publish_mode
        run: |
          SHOULD="false"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.publish }}" = "true" ]; then
              SHOULD="true"
            fi
          else
            if [ "${{ steps.version.outputs.version_changed }}" = "true" ] && [ "${{ steps.guard.outputs.safe }}" = "true" ]; then
              SHOULD="true"
            fi
          fi

          echo "should_publish=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "Publish mode: $SHOULD"

      - name: Validate VSCE_PAT
        if: steps.publish_mode.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Falta el secret VSCE_PAT en el repositorio (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Publish to VS Marketplace
        if: steps.publish_mode.outputs.should_publish == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set +e
          OUTPUT=$(npx @vscode/vsce publish --packagePath .artifacts/access-explorer.vsix -p "$VSCE_PAT" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "Marketplace publish completado."
            exit 0
          fi

          if echo "$OUTPUT" | grep -qi "already exists"; then
            echo "La versión ya existe en Marketplace. Se marca como skip en lugar de error."
            exit 0
          fi

          echo "::error::Falló la publicación en Marketplace"
          exit $EXIT_CODE

      - name: Publish summary
        if: always()
        run: |
          echo "Resultado preflight: OK (compile + smoke + vsix)."
          echo "Version anterior: ${{ steps.version.outputs.old_version }}"
          echo "Version actual:  ${{ steps.version.outputs.new_version }}"
          echo "Safe publish:    ${{ steps.guard.outputs.safe }}"
          echo "Should publish:  ${{ steps.publish_mode.outputs.should_publish }}"
